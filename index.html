<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>Lớp Anh thầy Kết - Game Từ vựng A</title>


<style>

/* =====================================================
   BODY
===================================================== */

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family: monospace;

    background-image: url("BackA.png");

    background-size: contain;

    background-position: center;

    background-repeat: no-repeat;

    background-attachment: fixed;

}


/* =====================================================
   SCORE
===================================================== */

#score {

    position: fixed;

    top: 10px;
    right: 15px;

    z-index: 1000;

    font-size: clamp(18px, 4vw, 26px);

    font-weight: bold;

    color: #C62828;

}


/* =====================================================
   SOUND BUTTON
===================================================== */

#soundBtn {

    position: fixed;

    top: 8px;
    left: 10px;

    z-index: 1000;

    width: 42px;
    height: 42px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.9);

    font-size: 20px;

    cursor: pointer;

}


/* =====================================================
   WORD BOX
===================================================== */

#wordBox {

    position: fixed;

    left: 50%;

    top: 0;

    transform: translateX(-50%);

    width: 90%;

    max-width: 600px;

    padding: 14px;

    box-sizing: border-box;

    text-align: center;

    background: rgba(255,255,255,0.92);

    border-radius: 12px;

}


#word {

    font-size: clamp(34px, 8vw, 55px);

    line-height: 1.3;

    color: #D73535;

    font-weight: bold;

}


#tagline {

    margin-top: 5px;

    font-size: clamp(12px, 3.5vw, 18px);

    color: #061E29;

}


/* =====================================================
   INPUT AREA
===================================================== */

#inputContainer {

    position: fixed;

    left: 50%;

    bottom: 18px;

    transform: translateX(-50%);

    width: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;

    z-index: 500;

}


#input {

    width: min(55%, 400px);

    padding: 7px;

    box-sizing: border-box;

    text-align: center;

    font-family: monospace;

    font-size: clamp(24px, 6vw, 36px);

    color: #ff4500;

    border: 2px solid #ff4500;

    border-radius: 8px;

    outline: none;

}


/* =====================================================
   WRONG
===================================================== */

#input.wrong {

    border: 3px solid red;

    background: #ffe6e6;

}


/* =====================================================
   BUTTONS
===================================================== */

#buttonsRow {

    display: flex;

    gap: 10px;

}


.game-btn {

    padding: 8px 14px;

    font-family: monospace;

    font-size: clamp(14px, 4vw, 18px);

    border: none;

    border-radius: 7px;

    background: #5DD3B6;

    color: white;

    cursor: pointer;

}


.game-btn:hover {

    background: #ffb3ba;

}


/* =====================================================
   ANSWER
===================================================== */

#answerReveal {

    position: fixed;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    z-index: 5000;

    width: max-content;

    max-width: 85vw;

    padding: 25px 40px;

    box-sizing: border-box;

    text-align: center;

    font-family: monospace;

    font-size: clamp(40px, 10vw, 80px);

    font-weight: bold;

    color: white;

    background: rgba(211,53,53,0.96);

    border: 5px solid white;

    border-radius: 20px;

    box-shadow:
        0 0 20px rgba(0,0,0,0.3),
        0 0 40px rgba(211,53,53,0.5);

    opacity: 1;

    transition: opacity 0.2s;

}


#answerReveal.hidden {

    opacity: 0;

}


/* =====================================================
   CONFETTI
===================================================== */

.confetti {

    position: fixed;

    left: 50%;
    bottom: 70px;

    width: 10px;
    height: 10px;

    z-index: 4000;

    animation:
        confettiPop
        900ms
        ease-out
        forwards;

}


@keyframes confettiPop {

    0% {

        transform:
            translate(0,0)
            scale(1);

        opacity: 1;

    }

    100% {

        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(720deg)
            scale(0.5);

        opacity: 0;

    }

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #input {

        width: 70%;

    }

    #wordBox {

        width: 94%;

    }

}

</style>

</head>

/* =====================================================
   CÀI ĐẶT GAME
===================================================== */

/*
    TỐC ĐỘ CỐ ĐỊNH

    Muốn nhanh hơn:
    1.0
    1.2
    1.5

    Muốn chậm hơn:
    0.5
    0.6

    Tốc độ KHÔNG tự thay đổi.
*/

const SPEED = 1.3;


/*
    Khoảng cách từ trên xuống cuối màn hình.
*/

const BOTTOM_MARGIN = 120;



/* =====================================================
   DOM
===================================================== */

const wordBox =
    document.getElementById("wordBox");

const wordElement =
    document.getElementById("word");

const input =
    document.getElementById("input");

const scoreElement =
    document.getElementById("score");

const soundButton =
    document.getElementById("soundBtn");

const showAnswerButton =
    document.getElementById("showAnswerBtn");

const nextButton =
    document.getElementById("nextWordBtn");



/* =====================================================
   GAME STATE
===================================================== */

let deck = [];

let currentWord = null;

let positionY = 0;

let score = 0;

let gameState = "playing";

/*
    playing
    answer
*/

let answerTimeout = null;

let animationFrame = null;



/* =====================================================
   SHUFFLE
===================================================== */

function shuffle(array) {

    const result = [...array];


    for (
        let i = result.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );


        [
            result[i],
            result[j]
        ] =
        [
            result[j],
            result[i]
        ];

    }


    return result;

}



/* =====================================================
   LOAD NEXT WORD
===================================================== */

function nextWord() {

    /*
        Nếu hết bộ từ
        thì trộn lại.
    */

    if (deck.length === 0) {

        deck = shuffle(words);

    }


    currentWord =
        deck.shift();


    wordElement.textContent =
        currentWord[1];


    /*
        Hiển thị chữ cái đầu
        như code ban đầu của thầy.
    */

input.value = currentWord[0].charAt(0);

    input.classList.remove(
        "wrong"
    );


    positionY = 0;


    wordBox.style.top =
        "0px";


    gameState =
        "playing";


    /*
        Luôn focus vào ô nhập.
    */

    input.focus();

}



/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop() {

    /*
        Nếu không ở trạng thái chơi
        thì không di chuyển.
    */

    if (
        gameState !== "playing"
    ) {

        animationFrame =
            null;

        return;

    }


    /*
        Tốc độ luôn bằng SPEED.
    */

    positionY += SPEED;


    wordBox.style.top =
        positionY + "px";


    /*
        Nếu chưa xuống đáy
        thì tiếp tục.
    */

    if (
        positionY <
        window.innerHeight -
        BOTTOM_MARGIN
    ) {

        animationFrame =
            requestAnimationFrame(
                gameLoop
            );

    }

    else {

        /*
            Từ đã xuống hết.
        */

        animationFrame =
            null;


        gameState =
            "answer";


        showAnswer();

    }

}



/* =====================================================
   START GAME LOOP
===================================================== */

function startGameLoop() {

    /*
        Không tạo thêm loop
        nếu đã có loop.
    */

    if (animationFrame !== null) {

        return;

    }


    animationFrame =
        requestAnimationFrame(
            gameLoop
        );

}



/* =====================================================
   SHOW ANSWER
===================================================== */

function showAnswer() {

    /*
        Nếu không có từ
        thì dừng.
    */

    if (!currentWord) {

        return;

    }


    /*
        Âm thanh báo hết giờ.
    */

    playTimeUpSound();


    const answer =
        document.createElement(
            "div"
        );


    answer.id =
        "answerReveal";


    answer.textContent =
        currentWord[0];


    document.body.appendChild(
        answer
    );


    /*
        ===================================
        ĐỌC TỪ TIẾNG ANH
        ===================================

        Chỉ đọc 1 lần.
    */

    speakWord(
        currentWord[0]
    );


    /*
        ===================================
        NHẤP NHÁY 3 LẦN
        ===================================
    */

    let blinkCount = 0;


    const blinkTimer =
        setInterval(() => {

            answer.classList.toggle(
                "hidden"
            );


            blinkCount++;


            if (
                blinkCount >= 6
            ) {

                clearInterval(
                    blinkTimer
                );

            }

        }, 500);


    /*
        ===================================
        SAU 3 GIÂY
        ===================================
    */

    answerTimeout =
        setTimeout(() => {

            clearInterval(
                blinkTimer
            );


            /*
                Dừng đọc nếu vẫn còn.
            */

            stopSpeaking();


            answer.remove();


            nextWord();


            startGameLoop();


        }, 3000);

}



/* =====================================================
   CHECK ANSWER
===================================================== */

function checkAnswer() {

    if (
        gameState !== "playing"
    ) {

        return;

    }


    const typed =
        input.value
            .trim()
            .toLowerCase();


    const correct =
        currentWord[0]
            .trim()
            .toLowerCase();


    /*
        ===================================
        ĐÚNG
        ===================================
    */

    if (
        typed === correct
    ) {

        score++;


        scoreElement.textContent =
            "Score: " + score;


        input.classList.remove(
            "wrong"
        );


        playCorrectSound();


        createConfetti();


        /*
            Chỉ reset vị trí.
            KHÔNG tạo animation loop mới.
        */

        nextWord();
startGameLoop();

return;

    }


    /*
        ===================================
        SAI
        ===================================
    */

    input.classList.add(
        "wrong"
    );


    playWrongSound();


    setTimeout(() => {

        input.classList.remove(
            "wrong"
        );

    }, 300);

}



/* =====================================================
   ENTER
===================================================== */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            activateAudio();

            checkAnswer();

        }

    }
);



/* =====================================================
   NEXT BUTTON
===================================================== */

nextButton.addEventListener(
    "click",
    function() {

        activateAudio();


        if (
            gameState === "answer"
        ) {

            return;

        }


        nextWord();

    }
);



/* =====================================================
   SHOW ANSWER BUTTON
===================================================== */

showAnswerButton.addEventListener(
    "click",
    function() {

        activateAudio();


        if (
            gameState !== "playing"
        ) {

            return;

        }


        input.value =
            currentWord[0];


        input.focus();

    }
);



/* =====================================================
   CONFETTI
===================================================== */

function createConfetti() {

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        const colors = [

            "red",
            "hotpink",
            "cyan",
            "lime",
            "yellow",
            "violet"

        ];


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() *
                    colors.length
                )
            ];


        piece.style.setProperty(

            "--x",

            (
                Math.random() *
                700 -
                350

            ) + "px"

        );


        piece.style.setProperty(

            "--y",

            (
                -Math.random() *
                400 -
                150

            ) + "px"

        );


        document.body.appendChild(
            piece
        );


        setTimeout(() => {

            piece.remove();

        }, 1000);

    }

}



/* =====================================================
   WEB AUDIO
===================================================== */

let audioContext = null;

let masterGain = null;

let soundEnabled = true;

let musicInterval = null;


function activateAudio() {

    if (!soundEnabled) {

        return;

    }


    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        masterGain =
            audioContext.createGain();


        /*
            ÂM LƯỢNG TỔNG
        */

        masterGain.gain.value =
            0.30;


        masterGain.connect(
            audioContext.destination
        );

    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();

    }


    /*
        Bắt đầu nhạc nền
        chỉ một lần.
    */

    if (
        musicInterval === null
    ) {

        startMusic();

    }

}



/* =====================================================
   PLAY NOTE
===================================================== */

function playNote(
    frequency,
    duration,
    type,
    volume
) {

    if (
        !soundEnabled ||
        !audioContext
    ) {

        return;

    }


    const oscillator =
        audioContext.createOscillator();


    const gain =
        audioContext.createGain();


    oscillator.type =
        type;


    oscillator.frequency.value =
        frequency;


    gain.gain.setValueAtTime(
        0,
        audioContext.currentTime
    );


    gain.gain.linearRampToValueAtTime(
        volume,
        audioContext.currentTime + 0.02
    );


    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime +
        duration
    );


    oscillator.connect(gain);

    gain.connect(masterGain);


    oscillator.start();


    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}



/* =====================================================
   NHẠC NỀN
===================================================== */

const melody = [

    523.25,
    659.25,
    783.99,
    659.25,

    587.33,
    698.46,
    880,
    698.46

];


let melodyIndex = 0;


function startMusic() {

    function playMelody() {

        if (!soundEnabled) {

            return;

        }


        playNote(

            melody[melodyIndex],

            0.28,

            "triangle",

            0.1

        );


        melodyIndex++;


        if (
            melodyIndex >=
            melody.length
        ) {

            melodyIndex = 0;

        }

    }


    playMelody();


    musicInterval =
        setInterval(
            playMelody,
            550
        );

}



/* =====================================================
   CORRECT SOUND
===================================================== */

function playCorrectSound() {

    activateAudio();


    playNote(
        523.25,
        0.15,
        "sine",
        1.25
    );


    setTimeout(() => {

        playNote(
            659.25,
            0.15,
            "sine",
            1.25
        );

    }, 100);


    setTimeout(() => {

        playNote(
            783.99,
            0.30,
            "sine",
            1.30
        );

    }, 200);

}



/* =====================================================
   WRONG SOUND
===================================================== */

function playWrongSound() {

    activateAudio();


    playNote(
        180,
        0.18,
        "square",
        1.12
    );

}



/* =====================================================
   TIME UP SOUND
===================================================== */

function playTimeUpSound() {

    activateAudio();


    playNote(
        392,
        0.18,
        "triangle",
        1.18
    );


    setTimeout(() => {

        playNote(
            294,
            0.25,
            "triangle",
            1.18
        );

    }, 180);

}



/* =====================================================
   ĐỌC TỪ TIẾNG ANH
===================================================== */

function speakWord(word) {

    if (
        !soundEnabled
    ) {

        return;

    }


    if (
        !("speechSynthesis" in window)
    ) {

        return;

    }


    /*
        Xóa câu đọc trước.
    */

    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            word
        );


    utterance.lang =
        "en-US";


    /*
        Đọc chậm vừa phải
        để học sinh nghe rõ.
    */

    utterance.rate =
        0.80;


    utterance.pitch =
        1;


    utterance.volume =
        1;


    window.speechSynthesis.speak(
        utterance
    );

}



/* =====================================================
   DỪNG ĐỌC
===================================================== */

function stopSpeaking() {

    if (
        "speechSynthesis" in window
    ) {

        window.speechSynthesis.cancel();

    }

}



/* =====================================================
   SOUND BUTTON
===================================================== */

soundButton.addEventListener(
    "click",
    function() {

        if (soundEnabled) {

            soundEnabled = false;


            this.textContent =
                "🔇";


            if (
                musicInterval !== null
            ) {

                clearInterval(
                    musicInterval
                );

                musicInterval =
                    null;

            }


            stopSpeaking();

        }

        else {

            soundEnabled = true;


            this.textContent =
                "🔊";


            activateAudio();

        }

    }
);



/* =====================================================
   KÍCH HOẠT ÂM THANH KHI NGƯỜI DÙNG TƯƠNG TÁC
===================================================== */

document.addEventListener(
    "click",
    activateAudio,
    { once: true }
);


document.addEventListener(
    "touchstart",
    activateAudio,
    { once: true }
);


document.addEventListener(
    "keydown",
    activateAudio,
    { once: true }
);



/* =====================================================
   START
===================================================== */

deck =
    shuffle(words);


nextWord();


startGameLoop();

</script>
